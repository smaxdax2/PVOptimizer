name: Build Android App (APK)

on:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android_app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for release
        run: |
          mv android_app/app/build/outputs/apk/debug/app-debug.apk android_app/app/build/outputs/apk/debug/PVOptimizer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PVOptimizer-App
          path: android_app/app/build/outputs/apk/debug/PVOptimizer.apk
          if-no-files-found: error
