<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PV Optimizer Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <div class="brand">☀️ PV Optimizer</div>
        <div class="nav-links">
            <a href="#" class="active" onclick="switchTab('dashboard')">Dashboard</a>
            <a href="#" onclick="switchTab('config')">Konfiguration</a>
            <a href="/test.html" target="_blank" id="nav-simulator">Simulator</a>
        </div>
    </div>

    <div id="dashboard-view">
        <div class="grid-dash">
            <div class="card">
                <div class="card-title">PV Erzeugung</div>
                <div class="card-value green" id="pv-power">0 W</div>
            </div>
            <div class="card">
                <div class="card-title">Hausverbrauch</div>
                <div class="card-value red" id="load-power">0 W</div>
            </div>
            <div class="card">
                <div class="card-title">Netz (Bezug / Einspeisung)</div>
                <div class="card-value" id="grid-power">0 W</div>
            </div>
            <div class="card">
                <div class="card-title">Batterie</div>
                <div class="card-value blue" id="battery">0 %</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Verbraucher</h2>
                <button class="btn" onclick="triggerScan()" id="btn-scan">Suchen (Scan)</button>
            </div>

            <div class="consumer-list" id="consumers-container">
                <!-- Consumers will be injected here -->
                <div style="text-align: center; color: var(--text-secondary); padding: 2rem;">Lädt Verbraucher...</div>
            </div>
        </div>
    </div>

    <div id="config-view" class="hidden">
        <div class="card">
            <h2>System Konfiguration</h2>
            <form id="config-form" onsubmit="saveConfig(event)">
                <div class="grid-dash">
                    <div class="form-group">
                        <label>Fronius IP Adresse</label>
                        <input type="text" id="cfg-fronius" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Batterie Schwellenwert (%)</label>
                        <input type="number" id="cfg-bat" class="form-control" min="0" max="100" step="1" required>
                    </div>
                </div>
                
                <div class="grid-dash">
                    <div class="form-group">
                        <label>Scan Intervall (Sekunden)</label>
                        <input type="number" id="cfg-scan-int" class="form-control" min="10" required>
                    </div>
                    <div class="form-group">
                        <label>Optimizer Intervall (Sekunden)</label>
                        <input type="number" id="cfg-opt-int" class="form-control" min="5" required>
                    </div>
                </div>

                <h3>Warmwasser (Relais)</h3>
                <div class="grid-dash">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="cfg-wh-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Leistung (W)</label>
                        <input type="number" id="cfg-wh-power" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>GPIO Pin</label>
                        <input type="number" id="cfg-wh-pin" class="form-control" required>
                    </div>
                </div>

                <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <button type="submit" class="btn primary">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">Nachricht gespeichert.</div>

    <script>
        let isConfigLoaded = false;

        function switchTab(tab) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'dashboard') {
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('config-view').classList.add('hidden');
            } else if (tab === 'config') {
                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('config-view').classList.remove('hidden');
                if (!isConfigLoaded) loadConfig();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // --- DASHBOARD DATA ---

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();

                    document.getElementById('pv-power').textContent = Math.round(data.pv_power_w) + ' W';
                    document.getElementById('load-power').textContent = Math.round(data.load_power_w) + ' W';

                    const gridLabel = data.grid_power_w > 0 ? "Bezug" : (data.grid_power_w < 0 ? "Einspeisung" : "-");
                    const gp = document.getElementById('grid-power');
                    gp.textContent = Math.round(Math.abs(data.grid_power_w)) + ' W (' + gridLabel + ')';
                    gp.className = 'card-value ' + (data.grid_power_w > 0 ? 'red' : 'green');

                    document.getElementById('battery').textContent = data.battery_percent.toFixed(1) + ' %';
                }
            } catch (e) {
                console.error('Error fetching status', e);
                if (window.location.protocol === 'file:') {
                    document.getElementById('consumers-container').innerHTML = '<div style="color:red; text-align:center; padding: 2rem;"><strong>Fehler:</strong> Sie haben die HTML-Datei direkt geöffnet (file://). Bitte öffnen Sie stattdessen <a href="http://localhost:8000/">http://localhost:8000/</a> in Ihrem Browser!</div>';
                }
            }
        }

        async function fetchConsumers() {
            try {
                const res = await fetch('/api/consumers');
                if (res.ok) {
                    const consumers = await res.json();
                    const container = document.getElementById('consumers-container');
                    
                    // Cleanup removed elements if any, remove initial loading text
                    if (container.innerHTML.includes('Lädt Verbraucher')) {
                        container.innerHTML = '';
                    }

                    const currentIds = new Set(consumers.map(c => 'cons-' + c.id));
                    Array.from(container.children).forEach(child => {
                        if (!currentIds.has(child.id)) {
                            child.remove();
                        }
                    });

                    consumers.forEach(c => {
                        const isPlug = c.type !== 'WaterHeater';
                        const statusClass = c.is_online ? 'online' : 'offline';
                        const statusText = c.is_online ? 'Online' : 'Offline';
                        const typeText = isPlug ? 'Smart Plug' : 'Relais';
                        const ipText = c.ip ? ` | IP: ${c.ip}` : '';
                        const isPlugDisabled = isPlug && c.is_enabled === false;

                        let el = document.getElementById('cons-' + c.id);
                        if (!el) {
                            el = document.createElement('div');
                            el.id = 'cons-' + c.id;
                            el.className = 'consumer-item';
                            container.appendChild(el);
                            
                            if (isPlug) {
                                el.innerHTML = `
                                    <div class="consumer-info">
                                        <h4><span class="status-dot ${statusClass}" title="${statusText}" id="dot-${c.id}"></span> 
                                            <input type="text" class="form-control" style="display:inline-block; width: 250px; margin-left: 5px; padding: 2px;" id="name-${c.id}" value="${c.name}" onchange="saveDashboardPlugs()">
                                        </h4>
                                        <div class="consumer-meta" style="margin-top: 5px;">
                                            ${typeText} ${ipText} | Leistung: 
                                            <input type="number" class="form-control" style="display:inline-block; width: 80px; padding: 2px;" id="power-${c.id}" value="${c.power_w}" onchange="saveDashboardPlugs()"> W
                                        </div>
                                    </div>
                                    <div class="consumer-controls">
                                        <div class="control-group">
                                            <span class="control-label">Aktiviert</span>
                                            <input type="checkbox" id="enabled-${c.id}" ${c.is_enabled ? 'checked' : ''} onchange="saveDashboardPlugs()" style="transform: scale(1.2);">
                                        </div>
                                        <div class="control-group">
                                            <span class="control-label">Manuell</span>
                                            <label class="switch">
                                                <input type="checkbox" id="override-${c.id}" onchange="toggleOverride('${c.id}', this.checked)" ${c.is_manual_override ? 'checked' : ''}>
                                                <span class="slider"></span>
                                            </label>
                                        </div>
                                        <div class="control-group">
                                            <span class="control-label">Status</span>
                                            <label class="switch">
                                                <input type="checkbox" id="power-sw-${c.id}" onchange="togglePower('${c.id}', this.checked)" ${c.is_on ? 'checked' : ''} ${!c.is_manual_override ? 'disabled' : ''}>
                                                <span class="slider green"></span>
                                            </label>
                                        </div>
                                    </div>
                                `;
                            } else {
                                el.innerHTML = `
                                    <div class="consumer-info">
                                        <h4><span class="status-dot ${statusClass}" title="${statusText}" id="dot-${c.id}"></span> <span id="name-${c.id}">${c.name}</span></h4>
                                        <div class="consumer-meta">${typeText} | <span id="power-text-${c.id}">${c.power_w}</span> W ${ipText}</div>
                                    </div>
                                    <div class="consumer-controls">
                                        <div class="control-group">
                                            <span class="control-label">Manuell</span>
                                            <label class="switch">
                                                <input type="checkbox" id="override-${c.id}" onchange="toggleOverride('${c.id}', this.checked)" ${c.is_manual_override ? 'checked' : ''}>
                                                <span class="slider"></span>
                                            </label>
                                        </div>
                                        <div class="control-group">
                                            <span class="control-label">Status</span>
                                            <label class="switch">
                                                <input type="checkbox" id="power-sw-${c.id}" onchange="togglePower('${c.id}', this.checked)" ${c.is_on ? 'checked' : ''} ${!c.is_manual_override ? 'disabled' : ''}>
                                                <span class="slider green"></span>
                                            </label>
                                        </div>
                                    </div>
                                `;
                            }
                        } else {
                            // Update live data silently
                            el.style.opacity = isPlugDisabled ? '0.6' : '1';
                            document.getElementById('dot-' + c.id).className = `status-dot ${statusClass}`;
                            document.getElementById('dot-' + c.id).title = statusText;
                            document.getElementById('override-' + c.id).checked = c.is_manual_override;
                            
                            const pSw = document.getElementById('power-sw-' + c.id);
                            pSw.checked = c.is_on;
                            pSw.disabled = !c.is_manual_override;
                            
                            if (!isPlug) {
                                document.getElementById('name-' + c.id).textContent = c.name;
                                document.getElementById('power-text-' + c.id).textContent = c.power_w;
                            }
                        }
                    });
                }
            } catch (e) { console.error('Error fetching consumers', e); }
        }

        async function toggleOverride(c_id, is_manual) {
            await fetch(`/api/consumers/${c_id}/override`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_manual_override: is_manual })
            });
            fetchConsumers();
        }

        async function togglePower(c_id, is_on) {
            const res = await fetch(`/api/consumers/${c_id}/toggle`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_on: is_on })
            });
            if (!res.ok) {
                const data = await res.json();
                alert(data.detail);
                fetchConsumers(); // Reset checkbox
            }
        }

        async function triggerScan() {
            const btn = document.getElementById('btn-scan');
            btn.innerHTML = 'Scan läuft... <div class="loader"></div>';
            btn.disabled = true;
            try {
                await fetch('/api/scan', { method: 'POST' });
                showToast("Scan erfolgreich angestoßen.");
                setTimeout(() => {
                    fetchConsumers();
                    loadConfig();
                }, 2000);
            } catch (e) {
                if (window.location.protocol === 'file:') {
                    showToast("Fehler: Bitte Dashboard über http://localhost:8000 öffnen!");
                } else {
                    showToast("Fehler beim Scannen.");
                }
            } finally {
                btn.innerHTML = 'Suchen (Scan)';
                btn.disabled = false;
            }
        }

        // --- CONFIG DATA ---

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const conf = await res.json();
                
                if (conf.mock_inverter_enabled === false) {
                    document.getElementById('nav-simulator').style.display = 'none';
                }

                document.getElementById('cfg-fronius').value = conf.fronius_ip || '';
                document.getElementById('cfg-bat').value = conf.battery_threshold_percent || 90;
                document.getElementById('cfg-scan-int').value = conf.scan_interval_sec || 3600;
                document.getElementById('cfg-opt-int').value = conf.optimize_interval_sec || 60;

                if (conf.water_heater) {
                    document.getElementById('cfg-wh-name').value = conf.water_heater.name || '';
                    document.getElementById('cfg-wh-power').value = conf.water_heater.power_w || '';
                    document.getElementById('cfg-wh-pin').value = conf.water_heater.gpio_pin || '';
                }

                isConfigLoaded = true;
            } catch (e) { console.error(e); }
        }

        async function saveDashboardPlugs() {
            try {
                const res = await fetch('/api/config');
                let conf = await res.json();
                
                const newPlugs = [];
                conf.plugs.forEach(p => {
                    const c_id = 'plug_' + p.ip.replace(/\./g, '_');
                    const nameEl = document.getElementById('name-' + c_id);
                    if (nameEl) {
                        newPlugs.push({
                            name: nameEl.value,
                            ip: p.ip,
                            power_w: parseFloat(document.getElementById('power-' + c_id).value),
                            is_enabled: document.getElementById('enabled-' + c_id).checked
                        });
                        
                        // Update visual opacity immediately
                        const isEnabled = document.getElementById('enabled-' + c_id).checked;
                        document.getElementById('cons-' + c_id).style.opacity = !isEnabled ? '0.6' : '1';
                    } else {
                        newPlugs.push(p);
                    }
                });
                
                conf.plugs = newPlugs;
                
                const postRes = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(conf)
                });
                if (postRes.ok) {
                    showToast("Steckdosen gespeichert!");
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function saveConfig(e) {
            e.preventDefault();

            const req = {
                fronius_ip: document.getElementById('cfg-fronius').value,
                battery_threshold_percent: parseFloat(document.getElementById('cfg-bat').value),
                scan_interval_sec: parseInt(document.getElementById('cfg-scan-int').value),
                optimize_interval_sec: parseInt(document.getElementById('cfg-opt-int').value),
                water_heater: {
                    name: document.getElementById('cfg-wh-name').value,
                    power_w: parseFloat(document.getElementById('cfg-wh-power').value),
                    gpio_pin: parseInt(document.getElementById('cfg-wh-pin').value)
                }
            };

            // We must read existing plugs to include them, since they aren't on this page anymore
            try {
                const curRes = await fetch('/api/config');
                const curConf = await curRes.json();
                req.plugs = curConf.plugs || [];
                
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(req)
                });
                if (res.ok) {
                    showToast("Konfiguration gespeichert!");
                    fetchConsumers(); // Reload consumers list
                }
            } catch (err) {
                showToast("Speichern fehlgeschlagen.");
            }
        }

        // Loop
        setInterval(() => {
            if (!document.getElementById('dashboard-view').classList.contains('hidden')) {
                fetchStatus();
                fetchConsumers();
            }
        }, 5000); // Refresh UI every 5 seconds

        // Init
        fetchStatus();
        fetchConsumers();
        loadConfig();
    </script>
</body>

</html>
